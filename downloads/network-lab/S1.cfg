! JC portfolio practice lab; Catalyst 2960 / IOS style; not device-validated.
! Isolated Packet Tracer practice only. Create a new topology.
enable
configure terminal
hostname S1
vlan 10
name STUDENTS
exit
vlan 20
name STAFF
exit
interface FastEthernet0/1
switchport mode access
switchport access vlan 10
spanning-tree portfast
no shutdown
exit
interface FastEthernet0/2
switchport mode access
switchport access vlan 20
spanning-tree portfast
no shutdown
exit
interface FastEthernet0/24
switchport mode trunk
switchport trunk allowed vlan 10,20
no shutdown
exit
end
