<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 615" role="img" aria-labelledby="title desc"><title id="title">Portfolio delivery flow</title><desc id="desc">A browser requests static HTML, CSS, JavaScript, images and downloads from Vercel. Project demos are external links.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#42614c"/></marker></defs><rect width="540" height="615" fill="#f7f8f4"/><g font-family="Helvetica,Arial,sans-serif"><rect x="20" y="25" width="500" height="110" rx="4" fill="#10221c" stroke="#9fb4a4"/><text x="40" y="55" fill="#f7faf7" font-size="23" font-weight="700">Visitor’s browser</text><text x="40" y="86" fill="#f7faf7" font-size="19">Open the portfolio or a case study</text><path d="M270 145V163" fill="none" stroke="#42614c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="170" width="500" height="110" rx="4" fill="#e9eee8" stroke="#9fb4a4"/><text x="40" y="200" fill="#14251f" font-size="23" font-weight="700">Vercel static hosting</text><text x="40" y="231" fill="#14251f" font-size="19">HTML, CSS, JavaScript and images</text><text x="40" y="255" fill="#14251f" font-size="19">Public CV and project resources</text><path d="M270 290V308" fill="none" stroke="#42614c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="315" width="500" height="110" rx="4" fill="#e9eee8" stroke="#9fb4a4"/><text x="40" y="345" fill="#14251f" font-size="23" font-weight="700">Page interactions</text><text x="40" y="376" fill="#14251f" font-size="19">Menu and gallery behavior in browser</text><text x="40" y="400" fill="#14251f" font-size="19">No portfolio account database</text><path d="M270 435V453" fill="none" stroke="#42614c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="460" width="500" height="110" rx="4" fill="#e9eee8" stroke="#9fb4a4"/><text x="40" y="490" fill="#14251f" font-size="23" font-weight="700">External project links</text><text x="40" y="521" fill="#14251f" font-size="19">Public demos and GitHub source</text><text x="40" y="545" fill="#14251f" font-size="19">Separate from portfolio hosting</text></g></svg>