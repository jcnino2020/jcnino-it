<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 615" role="img" aria-labelledby="title desc"><title id="title">HydroAlert local report flow</title><desc id="desc">A field observation is validated, saved to the browser reports store, and displayed in local history. It is not transmitted to officials.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#42614c"/></marker></defs><rect width="540" height="615" fill="#f7f8f4"/><g font-family="Helvetica,Arial,sans-serif"><rect x="20" y="25" width="500" height="110" rx="4" fill="#10221c" stroke="#9fb4a4"/><text x="40" y="55" fill="#f7faf7" font-size="23" font-weight="700">Field observation</text><text x="40" y="86" fill="#f7faf7" font-size="19">Station, type, optional level and note</text><text x="40" y="110" fill="#f7faf7" font-size="19">Optional device location and photo</text><path d="M270 145V163" fill="none" stroke="#42614c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="170" width="500" height="110" rx="4" fill="#e9eee8" stroke="#9fb4a4"/><text x="40" y="200" fill="#14251f" font-size="23" font-weight="700">Validation in core.js</text><text x="40" y="231" fill="#14251f" font-size="19">Check fields, note length and photo</text><text x="40" y="255" fill="#14251f" font-size="19">Reject invalid inputs before saving</text><path d="M270 290V308" fill="none" stroke="#42614c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="315" width="500" height="110" rx="4" fill="#e9eee8" stroke="#9fb4a4"/><text x="40" y="345" fill="#14251f" font-size="23" font-weight="700">HydroStore in storage.js</text><text x="40" y="376" fill="#14251f" font-size="19">IndexedDB: hydroalert-prototype</text><text x="40" y="400" fill="#14251f" font-size="19">Object store: reports · key: id</text><path d="M270 435V453" fill="none" stroke="#42614c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="460" width="500" height="110" rx="4" fill="#e9eee8" stroke="#9fb4a4"/><text x="40" y="490" fill="#14251f" font-size="23" font-weight="700">Local history and export</text><text x="40" y="521" fill="#14251f" font-size="19">Read report details in this browser</text><text x="40" y="545" fill="#14251f" font-size="19">No authority delivery endpoint</text></g></svg>