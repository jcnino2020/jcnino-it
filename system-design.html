<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>System Design | JC Niñonuevo | IT Portfolio</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- SEO & Metadata -->
  <meta name="description" content="Database schemas, Entity-Relationship Diagrams, Level-1 DFDs, and API request models designed by JC Niñonuevo.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jcnino2020.github.io/jcnino/system-design.html">
  <meta property="og:title" content="System Design | JC Niñonuevo">
  <meta property="og:description" content="Database schemas, Entity-Relationship Diagrams, Level-1 DFDs, and API request models designed by JC Niñonuevo.">
  <meta property="og:image" content="images/hero_developer_ide.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="System Design | JC Niñonuevo">
  <meta name="twitter:description" content="Database schemas, Entity-Relationship Diagrams, Level-1 DFDs, and API request models designed by JC Niñonuevo.">
  <meta name="twitter:image" content="images/hero_developer_ide.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/portfolio.css">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg': '#EEF2F7',
          'bg-alt': '#F8FAFC',
          'surface': '#FFFFFF',
          'surface-raised': '#EFF6FF',
          'border': '#DCE3EA',
          'border-strong': '#CBD5E1',
          'text-main': '#0F172A',
          'text-body': '#334155',
          'text-muted': '#475569',
          'text-faint': '#64748B',
          'accent': '#2563EB',
          'accent-teal': '#0F766E',
        },
        fontFamily: {
          sans: ['Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
        },
      },
    },
  }
</script>

</head>
<body class="min-h-screen">

<div id="navbar-placeholder"></div>

<!-- Assets -->
<script src="assets/portfolio.js" defer></script>

<div class="pt-16 md:pt-20">

  <!-- Page Header -->
  <section id="page-header" class="pt-6 pb-6 md:py-12 border-b border-border">
    <div class="max-w-7xl mx-auto px-6 sm:px-10">
      <div class="flex flex-col md:flex-row items-start md:items-end justify-between gap-6">
        <div>
          <p id="header-eyebrow" class="gsap-header-item text-text-muted text-xs font-bold uppercase mb-4">Category 02</p>
          <h1 id="header-title" class="gsap-header-item text-4xl sm:text-5xl text-text-main font-bold">System Design</h1>
          <p id="header-desc" class="gsap-header-item text-text-muted text-lg max-w-lg mt-4">Normalized database schemas, Entity-Relationship blueprints, Level-1 data flows, and secure gateway authentication topologies.</p>
        </div>
        <div class="flex justify-end">
          <p id="photo-count" class="gsap-header-item text-text-muted text-xs font-bold"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Gallery Grid -->
  <section class="pt-2 pb-6 md:py-12">
    <div class="max-w-7xl mx-auto px-6 sm:px-10">
      <div class="gallery-grid" id="main-grid"></div>
    </div>
  </section>
  <script src="assets/gallery-data.js"></script>
  <script>
  const allPhotos = window.galleryData.framed.map((p, i) => {
    const base = p.file.replace(/\.jpe?g$/i, '');
    return {
      id: i,
      src: 'images/Framed%20Moments/' + p.file,
      subfolder: 'Framed Moments',
      base: base,
      alt: p.alt || ('System design blueprint — ' + base)
    };
  });

  function buildCard(p, gallery) {
    const wrap = document.createElement('div');
    wrap.className = 'gallery-item bg-white border border-border-strong rounded-2xl overflow-hidden shadow-sm hover:shadow-md hover:border-slate-300 transition-all duration-300 cursor-pointer flex flex-col group';
    const b = p.base;
    const sf = p.subfolder;

    // Parse Alt text into Title and Description
    let title = 'Architecture Model';
    let description = p.alt || '';
    if (p.alt && p.alt.includes(':')) {
      const parts = p.alt.split(':');
      title = parts[0].trim();
      description = parts.slice(1).join(':').trim();
    }

    wrap.innerHTML = `
      <div class="relative overflow-hidden aspect-[4/3] bg-slate-50 border-b border-border-strong">
        <picture>
          <source
            type="image/webp"
            srcset="
              images/optimized/800/${sf}/${b}-800.webp 800w,
              images/optimized/1200/${sf}/${b}-1200.webp 1200w,
              images/optimized/1600/${sf}/${b}-1600.webp 1600w
            "
            sizes="(max-width: 600px) 100vw, (max-width: 1024px) 50vw, 33vw"
          />
          <img
            src="images/optimized/1200/${sf}/${b}-1200.webp"
            alt="${p.alt}"
            loading="lazy"
            decoding="async"
            class="w-full h-full object-cover transform group-hover:scale-[1.03] transition-transform duration-500"
            onerror="this.src='${p.src}'" />
        </picture>
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      </div>
      <div class="p-5 flex-grow flex flex-col justify-between">
        <div>
          <h3 class="text-sm font-bold text-slate-800 font-sans tracking-tight mb-1 group-hover:text-blue-600 transition-colors">${title}</h3>
          <p class="text-xs text-text-muted leading-relaxed font-normal">${description}</p>
        </div>
        <div class="flex items-center gap-1.5 text-blue-600 text-[10px] font-bold font-mono uppercase tracking-wider mt-4">
          <span>View Blueprint</span>
          <svg class="w-3.5 h-3.5 transform group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </div>
      </div>
    `;
    wrap.addEventListener('click', () => openLightbox(p, gallery));
    return wrap;
  }

  function renderGrid() {
    const grid = document.getElementById('main-grid');
    if(!grid) return;
    grid.innerHTML = '';
    document.getElementById('photo-count').textContent = allPhotos.length + ' designs';
    allPhotos.forEach(p => grid.appendChild(buildCard(p, allPhotos)));

    // GSAP: batch animate gallery items as they enter viewport
    requestAnimationFrame(() => {
      ScrollTrigger.batch('#main-grid .gallery-item', {
        onEnter: batch => gsap.fromTo(batch,
          { y: 50, opacity: 0 },
          {
            y: 0, opacity: 1,
            duration: 0.6,
            stagger: 0.07,
            ease: 'power3.out',
            clearProps: 'transform,opacity'
          }
        ),
        once: true,
        start: 'top 95%'
      });
    });
  }

  document.addEventListener('DOMContentLoaded', renderGrid);
</script>

</div>

<div id="footer-placeholder"></div>


<!-- Lightbox -->
<div id="lightbox-placeholder"></div>



<!-- GSAP + ScrollTrigger -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/ScrollTrigger.min.js"></script>

<script>
  gsap.registerPlugin(ScrollTrigger);


  // ── 2. PAGE HEADER: staggered timeline on load (above fold — no ScrollTrigger)
  const headerTl = gsap.timeline({ delay: 0.3 });
  headerTl
    .fromTo('#header-eyebrow',
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }
    )
    .fromTo('#header-title',
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' },
      '-=0.35'
    )
    .fromTo('#header-desc',
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' },
      '-=0.4'
    )
    .fromTo('#photo-count',
      { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' },
      '-=0.3'
    );

  // ── 3. FOOTER: fade up on scroll
  gsap.fromTo('#site-footer',
    { y: 30, opacity: 0 },
    {
      y: 0, opacity: 1,
      duration: 0.6, ease: 'power2.out',
      scrollTrigger: {
        trigger: '#site-footer',
        start: 'top 95%',
        once: true
      }
    }
  );

  // Gallery items handled inside renderGrid() via ScrollTrigger.batch
</script>

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
